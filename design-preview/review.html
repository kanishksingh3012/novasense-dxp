<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaSense — Layout review</title><style>
*{box-sizing:border-box}body{margin:0;background:#dedfd7;color:#333;font:12px/1.4 Arial,sans-serif}header{position:sticky;top:0;z-index:2;background:#f9f8f6;border-bottom:1px solid #cbd0c1;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header>strong{font-size:13px}nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}button,a{font:inherit;color:inherit;border:1px solid #c2c9b7;border-radius:4px;padding:6px 9px;background:transparent;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#3e5148;color:white;border-color:#3e5148}button:focus-visible,a:focus-visible{outline:2px solid #333;outline-offset:2px}main{padding:18px 14px;overflow:hidden}.frame-wrap{margin:auto;position:relative;box-shadow:0 3px 18px #3332;background:#f9f8f6}iframe{border:0;display:block;transform-origin:top left;background:#f9f8f6}small{font-size:10px;color:#5f6858}
</style></head><body><header><strong>NovaSense <small>/ layout review</small></strong><nav aria-label="Review page"><button data-page="index.html" aria-pressed="true">Home</button><button data-page="product.html" aria-pressed="false">Product</button></nav><nav aria-label="Viewport width"><button data-width="1440" aria-pressed="true">Desktop</button><button data-width="768" aria-pressed="false">Tablet</button><button data-width="390" aria-pressed="false">Mobile</button><a href="index.html" target="_blank" rel="noopener">Open full size ↗</a></nav></header><main><div class="frame-wrap"><iframe title="NovaSense website preview" src="index.html" width="1440" height="1100"></iframe></div></main><script>
const frame=document.querySelector('iframe'),wrap=document.querySelector('.frame-wrap');let width=1440;
function fit(){const available=document.querySelector('main').clientWidth-28;const scale=Math.min(1,available/width);const height=Math.max(850,Math.round((window.innerHeight-110)/scale));frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform=`scale(${scale})`;wrap.style.width=(width*scale)+'px';wrap.style.height=(height*scale)+'px';}
document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));fit();}));
document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{frame.src=button.dataset.page;document.querySelectorAll('[data-page]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));document.querySelector('nav a').href=button.dataset.page;}));
new ResizeObserver(fit).observe(document.querySelector('main'));fit();
</script></body></html>
